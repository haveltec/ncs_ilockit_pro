
# https://devzone.nordicsemi.com/f/nordic-q-a/110879/flash-partitioning/485423

# Partitionen statisch festlegen, damit sie sich nicht unbeabsichtigt ändern können

EMPTY_0:
  address: 0x7c00
  end_address: 0x8000
  placement:
    after:
    - mcuboot
  region: flash_primary
  size: 0x400
app:
  address: 0x8800
  end_address: 0xbe000
  region: flash_primary
  size: 0xb5800
app_storage:
  address: 0x174000
  end_address: 0x178000
  region: flash_primary
  size: 0x4000
bootconf:
  address: 0xffd080
  end_address: 0xffd084
  region: bootconf
  size: 0x4
mcuboot:
  address: 0x0
  end_address: 0x7c00
  placement:
    align:
      end: 0x1000
    before:
    - mcuboot_primary
  region: flash_primary
  size: 0x7c00
mcuboot_pad:
  address: 0x8000
  end_address: 0x8800
  placement:
    before:
    - mcuboot_primary_app
  region: flash_primary
  size: 0x800
mcuboot_primary:
  address: 0x8000
  end_address: 0xbe000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  sharers: 0x1
  size: 0xb6000
  span: *id001
mcuboot_primary_app:
  address: 0x8800
  end_address: 0xbe000
  orig_span: &id002
  - app
  region: flash_primary
  size: 0xb5800
  span: *id002
mcuboot_secondary:
  address: 0xbe000
  end_address: 0x174000
  placement:
    after:
    - mcuboot_primary
    align:
      start: 0x1000
    align_next: 0x1000
  region: flash_primary
  share_size:
  - mcuboot_primary
  size: 0xb6000
otp:
  address: 0xffd500
  end_address: 0xffd9fc
  region: otp
  size: 0x4fc
settings_storage:
  address: 0x178000
  end_address: 0x17d000
  region: flash_primary
  size: 0x5000
sram_primary:
  address: 0x20000000
  end_address: 0x2001ff00
  region: sram_primary
  size: 0x1ff00
