# Example of sample specific Kconfig changes when building sample with MCUboot
# when using sysbuild.
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_BOOT_UPGRADE_ONLY=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Example of sample specific Kconfig changes when building sample with MCUboot
# when using sysbuild.

CONFIG_MAIN_STACK_SIZE=10240
CONFIG_MBEDTLS_CFG_FILE="mcuboot-mbedtls-cfg.h"

CONFIG_FLASH=y
# Zum Schützen der Firmware muss das auf y gesetzt werden
CONFIG_FPROTECT=n	
CONFIG_PM=y

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_BOOT_BOOTSTRAP=n
CONFIG_BOOT_UPGRADE_ONLY=n

### Minimal Configurations ###
CONFIG_B0_MIN_PARTITION_SIZE=y
CONFIG_BOOT_USE_MIN_PARTITION_SIZE=y
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_BOOT_BANNER=n
CONFIG_CLOCK_CONTROL=y
CONFIG_CONSOLE=n
CONFIG_CONSOLE_HANDLER=n
CONFIG_GPIO=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_LOG=n
CONFIG_NCS_SAMPLES_DEFAULTS=n
CONFIG_NO_RUNTIME_CHECKS=y
CONFIG_NRF_RTC_TIMER=n
CONFIG_PRINTK=n
CONFIG_SERIAL=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_UART_CONSOLE=n
CONFIG_MCUBOOT_SERIAL=n
CONFIG_SINGLE_APPLICATION_SLOT=y

# trying out some more (doesn't do much)
CONFIG_MPU=n
CONFIG_ARM_MPU=n
CONFIG_CBPRINTF_NANO=y
CONFIG_CBPRINTF_LIBC_SUBSTS=n
CONFIG_MINIMAL_LIBC=y

# trying out some more (doesn't do anything)
CONFIG_SPI=n
CONFIG_TIMEOUT_64BIT=n
CONFIG_TIMESLICING=n
CONFIG_MINIMAL_LIBC_OPTIMIZE_STRING_FOR_SIZE=y

# Decrease memory footprint
CONFIG_USE_SEGGER_RTT=n
CONFIG_ERRNO=n
CONFIG_RESET_ON_FATAL_ERROR=n
