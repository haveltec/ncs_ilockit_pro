CONFIG_NCS_SAMPLES_DEFAULTS=y
# Zum Schützen der Firmware muss das auf y gesetzt werden
CONFIG_FPROTECT=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Extended Advertising API (bt_le_ext_adv_*) wird in main.c genutzt
# TEST: fuer ADV_TEST_LEGACY=1 (main.c) wird nur Legacy-Advertising gebraucht.
# Zum Zurueckschalten auf Extended Advertising wieder auf y setzen.
CONFIG_BT_EXT_ADV=n

CONFIG_DK_LIBRARY=n

# Enable Logging and RTT
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_MODE_DEFERRED=n

# Enable GPIO
CONFIG_GPIO=y

# UART aktivieren (UARTE00 -> GPS-Modul, TX=P2.08, RX=P2.00)
# Der Konsolen-Output laeuft weiterhin ueber RTT (CONFIG_UART_CONSOLE=n)
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# CAN-Controller MCP251xFD an SPIM00.
# ACHTUNG: SPIM00 und UARTE00 sind derselbe Serial-Block (0x0004A000) -
# es kann immer nur eines von beidem laufen. Passend dazu muss im Board-DTS
# spi00 "okay" und uart00 "disabled" stehen (aktuell: CAN-Test).
# Zum Zurueckschalten auf GPS diesen Block auskommentieren.
# CAN_MCP251XFD ist "default y" und zieht CONFIG_SPI + CONFIG_CRC selbst nach.
CONFIG_CAN=y
# Bringup: der mcp251xfd-Treiber meldet mehrere Fehlerpfade nur auf DBG-Ebene
# (bzw. gar nicht) - fuer die Inbetriebnahme voll aufdrehen.
CONFIG_CAN_LOG_LEVEL_DBG=y
CONFIG_SPI_LOG_LEVEL_DBG=y

# Power Management aktivieren
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_TICKLESS_KERNEL=y

# Enable I2C driver
CONFIG_I2C=y
CONFIG_I2C_CALLBACK=y

# Enable nordic security backend and PSA APIs
#CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# CRC Bibliothek hinzufügen
CONFIG_CRC=y

# Dynamisches Festlegen des Advertisment Namens
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
# TEST: fester Default-Name (wird in main.c zusaetzlich per bt_set_name() gesetzt)
CONFIG_BT_DEVICE_NAME="ILI-PRO-TEST"
# Länge muss 25 betragen, wenn der Wert kleiner gewählt wird, startet das Advertisment nicht
CONFIG_BT_DEVICE_NAME_MAX=25

# Anzahl maximaler Verbindungen
CONFIG_BT_MAX_CONN=4

# Verbindungsparameter zur App
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=20
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=60
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=300
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Anzahl maximaler Verbindungen mit Smartphone
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=3

# PWM aktivieren
CONFIG_PWM=y
CONFIG_NRFX_PWM=y

# Reboot Library aktivieren
CONFIG_REBOOT=y

# ZMS/Flash aktivieren
CONFIG_FLASH=y
CONFIG_NVS=n
CONFIG_ZMS=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS_LOG_LEVEL_DBG=n
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# RAM Memory retention aktivieren
CONFIG_RETENTION=y
CONFIG_RETAINED_MEM=y

# Abfrage der RSSI-Werte aktivieren
CONFIG_BT_CTLR_CONN_RSSI=y

# Multithreading aktivieren
CONFIG_MULTITHREADING=y

# Watchdog hinzufügen
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# SAADC Wandler und PPI für Analogmessung aktivieren
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER=y

# Handsender Konfiguration
CONFIG_BT_CENTRAL=y
CONFIG_BT_SCAN=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_BT_SETTINGS=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# Increase stack size for the main thread and System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

#https://devzone.nordicsemi.com/guides/nrf-connect-sdk-guides/b/software/posts/building-a-ble-application-on-ncs-sdk---contrasting-to-softdevice-based-ble-applications---part-2-central-role#mcetoc_1f50ptl3g2

# FOTA update Service
#CONFIG_SECURE_BOOT=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y

# Basic SMP Befehle zum Löschen der Settings verbieten
CONFIG_MCUMGR_GRP_ZBASIC=n
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n

#https://www.youtube.com/watch?v=fCU8x-pmtqU

CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_ANALYZER_USE_LOG=n
CONFIG_THREAD_ANALYZER_AUTO=n

# Use Zephyr BLE Stack instead of Nordic
# Saves ~60kB of ROM
#CONFIG_BT_LL_SOFTDEVICE=n

#CONFIG_PWM_NRF_SW=y
#CONFIG_BT_TINYCRYPT_ECC=y

# Apple Find-My
#CONFIG_FMNA=y
#CONFIG_FMNA_NORDIC_PRODUCT_PLAN=n
#CONFIG_FMNA_LOG_LEVEL_DBG=n

#CONFIG_FMNA_CAPABILITY_PLAY_SOUND_ENABLED=y
#CONFIG_FMNA_CAPABILITY_DETECT_MOTION_ENABLED=y
#CONFIG_FMNA_CAPABILITY_BLE_SN_LOOKUP_ENABLED=y
#CONFIG_FMNA_CAPABILITY_NFC_SN_LOOKUP_ENABLED=n
#CONFIG_FMNA_CAPABILITY_FW_UPDATE_ENABLED=n
#CONFIG_FMNA_PAIRING_MODE_AUTO_ENTER=n
#CONFIG_FMNA_MANUFACTURER_NAME="haveltec GmbH"
#CONFIG_FMNA_SERVICE_HIDDEN_MODE=y
#CONFIG_FMNA_QUALIFICATION=y
# Bluetooth dependent configuration required by FMN
#CONFIG_BT_RX_STACK_SIZE=3072

# Zwei Advertising-Sets und zwei BLE IDs
#CONFIG_BT_ID_MAX=2
#CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# PSA Secure Storage
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CTR=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=1024

CONFIG_SECURE_STORAGE=y
#CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

CONFIG_ASSERT=y
CONFIG_DEBUG_OPTIMIZATIONS=y

